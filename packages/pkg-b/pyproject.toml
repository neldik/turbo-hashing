[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "pkg-b"
dynamic = ["version"]          # set by CI via SETUPTOOLS_SCM_PRETEND_VERSION_FOR_PKG_B
requires-python = ">=3.11"
dependencies = [
    "pkg-a",                   # internal: unpinned, pins come from constraint-dependencies
]

[tool.uv.sources]
pkg-a = { workspace = true }   # in-repo installs always use the local copy

[tool.setuptools_scm]
root = "../.."                 # fallback for local builds
tag_regex = "^v(?P<version>.+)$"
fallback_version = "0.0.0"
