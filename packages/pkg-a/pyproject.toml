[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "pkg-a"
dynamic = ["version"]          # set by CI via SETUPTOOLS_SCM_PRETEND_VERSION_FOR_PKG_A
requires-python = ">=3.11"
dependencies = [
    "six>=1.16",               # external: range here, exact pin from the lock
]

[tool.setuptools_scm]
root = "../.."                 # fallback for local builds
tag_regex = "^v(?P<version>.+)$"
fallback_version = "0.0.0"
